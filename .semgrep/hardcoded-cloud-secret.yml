rules:
  - id: hardcoded-aws-access-key
    languages: [generic]
    severity: ERROR
    message: |
      Hard-coded AWS access key id in source. Move to runtime config (env var or
      instance role) and rotate the exposed key immediately.
    pattern-regex: AKIA[0-9A-Z]{16}
    metadata:
      category: secret
      vulnerability_class: hardcoded credential
      confidence: high

  - id: hardcoded-jwt-token
    languages: [generic]
    severity: ERROR
    message: |
      Hard-coded JWT committed to source. Even expired, it leaks its payload
      (user/tenant identifiers) and may still be accepted by services that skip
      expiry checks. Remove it, invalidate the session/secret it was signed
      with, and inject test tokens at runtime instead.
    pattern-regex: \beyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{16,}\b
    metadata:
      category: secret
      vulnerability_class: hardcoded credential
      confidence: high

  - id: hardcoded-gitlab-token
    languages: [generic]
    severity: ERROR
    message: |
      Hard-coded GitLab token (glpat-... PAT or registry authToken) committed to
      source / CI / Dockerfile. Rotate and inject at build time via masked CI vars.
    pattern-regex: (glpat-[A-Za-z0-9_-]{20}|_authToken=["']?[A-Za-z0-9_-]{20})
    metadata:
      category: secret
      vulnerability_class: hardcoded credential
      confidence: high

  - id: hardcoded-github-token
    languages: [generic]
    severity: ERROR
    message: |
      Hard-coded GitHub token committed to source. Rotate it immediately and
      inject it at build time via a masked CI secret. A PAT reached the history
      through a committed .npmrc before (purged 2026-07).
    pattern-regex: (ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{50,})
    metadata:
      category: secret
      vulnerability_class: hardcoded credential
      confidence: high

  - id: hardcoded-private-key
    languages: [generic]
    severity: ERROR
    message: |
      Private key material committed to source. Keys belong in a secret store or
      on the host, never in the repository. A Let's Encrypt private key and two
      test keys reached the history this way (purged 2026-07).
    pattern-regex: -----BEGIN ([A-Z]+ )?PRIVATE KEY-----
    metadata:
      category: secret
      vulnerability_class: hardcoded credential
      confidence: high

  - id: credentials-in-connection-url
    languages: [generic]
    severity: ERROR
    message: |
      Connection URL with an inline password. Build the URL from environment
      variables instead. Production Postgres, Redis and RabbitMQ credentials all
      reached the history this way (purged 2026-07) -- including a production
      Redis URL sitting in test setup files.
      Local defaults such as postgres://postgres:postgres@localhost are excluded.
    patterns:
      # The host is part of the match on purpose: pattern-not-regex only sees the
      # matched span, which would stop at the `@`, so without it there is no way to
      # tell a local default from a real credential.
      - pattern-regex: (postgres(ql)?|mysql|mongodb(\+srv)?|redis|amqps?)://[A-Za-z0-9._%-]+:[^@\s"'`/]{4,}@[A-Za-z0-9._-]+
      # Local default credentials: noise, not a secret.
      - pattern-not-regex: ://(postgres|root|user|admin|test|guest):(postgres|root|user|admin|test|guest|password|pass)@(localhost|127\.0\.0\.1|host\.docker\.internal|postgres|redis|mongo|mysql|rabbitmq|[a-z-]*db)
    metadata:
      category: secret
      vulnerability_class: hardcoded credential
      confidence: medium

  - id: hardcoded-google-oauth-token
    languages: [generic]
    severity: ERROR
    message: |
      Hard-coded Google OAuth token committed to source. Revoke it and store
      tokens outside the repository. One reached the history through
      edata-server/src/models/customerCalendar.js (purged 2026-07).
    pattern-regex: \bya29\.[A-Za-z0-9_-]{30,}
    metadata:
      category: secret
      vulnerability_class: hardcoded credential
      confidence: high

  - id: plaintext-secret-in-comment
    languages: [generic]
    severity: ERROR
    message: |
      A comment appears to spell out a secret in clear text next to its hash.
      Two customer application keys reached the history exactly this way, as
      "for reference unhashed key : ..." in edata migrations. No scanner catches
      short human-chosen values; the comment is the only signal.
    patterns:
      # Require a plausible value after the separator, otherwise the rule stays red
      # on a comment whose value has just been masked by the history purge.
      # Both word orders: "unhashed key" and the French "mot de passe en clair".
      # Only in a comment (//, #, /*, *, --): code such as a cleartextPassword
      # field or variable must not match.
      - pattern-regex: (?im)(?://|#|/\*|^[ \t]*\*|--)[^\n]*?((unhashed|in ?clear|en clair|plain ?text|cleartext)[^\n]{0,30}(key|password|secret|token|mot de passe)|(key|password|secret|token|mot de passe)[^\n]{0,30}(unhashed|in ?clear|en clair|plain ?text|cleartext))[^\n]{0,12}[:=][ \t]*[A-Za-z0-9._@!$%+-]{6,}
      - pattern-not-regex: (?i)[:=][ \t]*(x{3,}|<[^>]{1,40}>|\.{3}|todo|redacted|placeholder|changeme|your[_-])
    metadata:
      category: secret
      vulnerability_class: hardcoded credential
      confidence: medium
