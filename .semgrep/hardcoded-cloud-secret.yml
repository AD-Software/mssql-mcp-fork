rules:
  - id: hardcoded-aws-access-key
    languages: [generic]
    severity: ERROR
    message: |
      Hard-coded AWS access key id in source. Move to runtime config (env var or
      instance role) and rotate the exposed key immediately.
    pattern-regex: AKIA[0-9A-Z]{16}
    metadata:
      category: secret
      vulnerability_class: hardcoded credential
      confidence: high

  - id: hardcoded-gitlab-token
    languages: [generic]
    severity: ERROR
    message: |
      Hard-coded GitLab token (glpat-... PAT or registry authToken) committed to
      source / CI / Dockerfile. Rotate and inject at build time via masked CI vars.
    pattern-regex: (glpat-[A-Za-z0-9_-]{20}|_authToken=[A-Za-z0-9_-]{20})
    metadata:
      category: secret
      vulnerability_class: hardcoded credential
      confidence: high
